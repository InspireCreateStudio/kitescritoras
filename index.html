<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit Escritoras</title>
<meta name="theme-color" content="#a5595d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Escritoras">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/32.png">
<link rel="apple-touch-icon" href="iconos/180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Paleta de marca Marta Lobo. Layout: barra lateral fija + planner por meses */
  --rosa: #a5595d;
  --rosa-2: #c0797a;
  --empolvado: #dfadad;
  --nube: #f0e6ea;
  --lino: #f8f2ef;
  --arena: #e9d8c9;
  --lavanda: #dcd2e1;
  --tinta: #3a2a2c;
  --gris: #7a6668;
  --linea: #e6d6d2;
  --papel: #fffdfc;
  --ok: #4f8a63;
  --ok-bg: #e2efe5;
  --aviso: #a8742a;
  --aviso-bg: #f6e8d2;
  --mal: #a83e3e;
  --mal-bg: #f6dcdc;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--lino); color: var(--tinta); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
a { color: var(--rosa); }
:focus-visible { outline: 2px solid var(--rosa); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100%; }
.side { background: var(--papel); border-right: 1px solid var(--linea); padding: 22px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 0 8px; }
.brand .k { font-family: var(--display); font-style: italic; font-size: 1.9rem; color: var(--rosa); line-height: 1; }
.brand .s { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gris); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--tinta); font-weight: 600; font-size: .93rem; }
.nav a:hover { background: var(--nube); }
.nav a[aria-current="page"] { background: var(--rosa); color: #fff; }
.nav a .n { font-family: var(--display); font-style: italic; width: 18px; text-align: right; opacity: .7; }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 6px; font-size: .8rem; color: var(--gris); }
.save { display: inline-flex; align-items: center; gap: 6px; }
.save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--empolvado); }
.save.ok::before { background: var(--ok); }
.save.local::before { background: var(--aviso); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--rosa); text-decoration: underline; cursor: pointer; text-align: left; font-size: .8rem; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 28px; border-bottom: 1px solid var(--linea); background: var(--lino); position: sticky; top: 0; z-index: 5; }
.proj { display: flex; align-items: center; gap: 8px; }
.proj label { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gris); }
.proj select { border: 1px solid var(--linea); background: var(--papel); border-radius: 8px; padding: 6px 10px; font-weight: 700; max-width: 300px; }
.month { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.month .lbl { font-family: var(--display); font-size: 1.45rem; font-weight: 600; min-width: 190px; text-align: center; text-transform: capitalize; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linea); background: var(--papel); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.iconbtn:hover { background: var(--nube); }
.btn { border: 1px solid var(--rosa); background: var(--rosa); color: #fff; border-radius: 999px; padding: 7px 16px; font-weight: 700; cursor: pointer; font-size: .88rem; white-space: nowrap; }
.btn:hover { background: #8f4a4e; }
.btn.ghost { background: transparent; color: var(--rosa); }
.btn.ghost:hover { background: var(--nube); }
.btn.sm { padding: 4px 12px; font-size: .8rem; }
.btn.danger { background: var(--mal); border-color: var(--mal); }

.content { padding: 26px 28px 60px; display: flex; flex-direction: column; gap: 22px; max-width: 1280px; width: 100%; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.head p { margin: 4px 0 0; color: var(--gris); max-width: 62ch; }
.eyebrow { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--rosa-2); font-weight: 700; }

.card { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card > .ch { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card .hint { color: var(--gris); font-size: .84rem; margin: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.tile { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border-top: 4px solid var(--empolvado); }
.tile .t { font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gris); font-weight: 700; }
.tile .v { font-family: var(--display); font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .d { font-size: .82rem; color: var(--gris); }
.tile.ok { border-top-color: var(--ok); }
.tile.warn { border-top-color: var(--aviso); }
.tile.bad { border-top-color: var(--mal); }
.tile.lav { border-top-color: #b6a6c2; }

.bar { height: 8px; background: var(--nube); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--rosa); border-radius: 99px; }
.bar.ok > i { background: var(--ok); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gris); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.field input, .field select, .field textarea { border: 1px solid var(--linea); border-radius: 8px; background: #fff; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--rosa-2); outline: none; box-shadow: 0 0 0 3px var(--nube); }
.count { font-weight: 600; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.count.over { color: var(--mal); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

.tblwrap { overflow-x: auto; border: 1px solid var(--linea); border-radius: 12px; background: #fff; }
table.tbl { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tbl th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gris); padding: 9px 8px; background: var(--nube); white-space: nowrap; font-weight: 700; position: sticky; top: 0; }
.tbl td { border-top: 1px solid var(--linea); padding: 3px 4px; vertical-align: middle; }
.tbl tr:hover td { background: #fdf8f7; }
.tbl input, .tbl select, .tbl textarea { width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 6px; border-radius: 6px; }
.tbl textarea { resize: vertical; min-height: 34px; line-height: 1.35; }
.tbl input:hover, .tbl textarea:hover { border-color: var(--linea); }
.tbl input:focus, .tbl textarea:focus, .tbl select:focus { border-color: var(--rosa-2); background: #fff; outline: none; }
.tbl input[type="number"], .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .calc { padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.tbl .calc.neg { color: var(--mal); }
.tbl .del { border: 0; background: none; color: var(--gris); cursor: pointer; font-size: 1.1rem; width: 30px; height: 30px; border-radius: 50%; }
.tbl .del:hover { background: var(--mal-bg); color: var(--mal); }
.tbl tfoot td { background: var(--nube); font-weight: 700; padding: 8px; }
.empty { padding: 18px; color: var(--gris); text-align: center; font-size: .9rem; }

select.pill { appearance: none; -webkit-appearance: none; border-radius: 999px !important; padding: 4px 12px !important; font-weight: 700; font-size: .78rem; text-align: center; cursor: pointer; border: 1px solid transparent; min-width: 96px; }
.t-ok { background: var(--ok-bg) !important; color: var(--ok); }
.t-mid { background: var(--lavanda) !important; color: #5a4766; }
.t-neu { background: #f1ebe9 !important; color: var(--gris); }
.t-bad { background: var(--mal-bg) !important; color: var(--mal); }
.t-hi { background: var(--rosa) !important; color: #fff; }
.t-warm { background: var(--arena) !important; color: #7a5636; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--linea); background: var(--papel); border-radius: 999px; padding: 5px 13px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }

/* Calendario */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dn { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gris); font-weight: 700; padding: 0 4px; }
.day { background: var(--papel); border: 1px solid var(--linea); border-radius: 10px; padding: 6px 7px; min-height: 104px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.day.blank { background: transparent; border: 1px dashed var(--linea); }
.day .num { font-family: var(--display); font-size: 1.15rem; font-weight: 600; line-height: 1; display: flex; justify-content: space-between; align-items: center; }
.day.today { border: 2px solid var(--rosa); }
.day.done { background: var(--ok-bg); border-color: #bcd8c4; }
.day.part { background: var(--aviso-bg); border-color: #ead1ad; }
.day.miss { background: var(--mal-bg); border-color: #e9bcbc; }
.day.rest { background: #f6f0ee; }
.day label { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 2px; font-size: .62rem; color: var(--gris); text-transform: uppercase; letter-spacing: .05em; }
.day input { width: 100%; min-width: 0; border: 1px solid transparent; background: rgba(255,255,255,.7); border-radius: 5px; padding: 2px 4px; font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
.day input.caps { text-align: left; }
.day input:focus { border-color: var(--rosa-2); outline: none; background: #fff; }
.day .chips { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.day .chips .chip { overflow: hidden; text-overflow: ellipsis; display: block; padding: 2px 7px; }
.post-day { min-height: 92px; }

/* Novela */
.beats { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.beat { background: var(--nube); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.beat .bn { font-family: var(--display); font-style: italic; font-size: 1.05rem; font-weight: 600; color: var(--rosa); }
.beat textarea { border: 1px solid transparent; background: rgba(255,255,255,.75); border-radius: 8px; padding: 7px; min-height: 120px; resize: vertical; font-size: .86rem; }
.beat input { border: 1px solid transparent; background: rgba(255,255,255,.75); border-radius: 8px; padding: 4px 7px; font-size: .8rem; }
.beat textarea:focus, .beat input:focus { border-color: var(--rosa-2); outline: none; background: #fff; }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.char { border: 1px solid var(--linea); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #fff; border-left: 5px solid var(--empolvado); }
.char.r-Protagonista { border-left-color: var(--rosa); }
.char.r-Interés { border-left-color: var(--rosa-2); }
.char.r-Antagonista { border-left-color: #8a7596; }
.char .top2 { display: flex; gap: 8px; align-items: center; }
.char .nm { font-family: var(--display); font-size: 1.3rem; font-weight: 600; border: 1px solid transparent; border-radius: 6px; padding: 2px 4px; flex: 1; min-width: 0; background: transparent; }
.char .nm:focus { border-color: var(--rosa-2); outline: none; }
.char .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kdp { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linea); }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .meta { font-size: .78rem; color: var(--gris); }
.li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--rosa); }

.phase { display: flex; flex-direction: column; gap: 8px; }
.phase .ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phase .ph .bar { flex: 1; min-width: 120px; max-width: 260px; }
.phase .ph .pct { font-size: .82rem; color: var(--gris); font-variant-numeric: tabular-nums; }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--gris); font: 11px var(--body); }

/* Modal y avisos */
.modal { position: fixed; inset: 0; background: rgba(58,42,44,.35); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal.open { display: flex; }
.modal .box { background: var(--papel); border-radius: 16px; padding: 22px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(58,42,44,.25); }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.days7 { display: flex; gap: 6px; flex-wrap: wrap; }
.days7 label { display: flex; align-items: center; gap: 4px; border: 1px solid var(--linea); border-radius: 999px; padding: 4px 10px; font-size: .84rem; cursor: pointer; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 16px; border-radius: 999px; display: none; gap: 12px; align-items: center; z-index: 60; font-size: .9rem; }
.toast.show { display: flex; }
.toast button { background: none; border: 0; color: var(--empolvado); font-weight: 700; cursor: pointer; text-decoration: underline; }
.note { background: var(--nube); border-radius: 10px; padding: 10px 14px; font-size: .86rem; color: var(--tinta); }

@media (max-width: 1000px) {
  .g3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--linea); }
  .nav { flex-direction: row; overflow-x: auto; width: 100%; }
  .nav a { white-space: nowrap; }
  .nav a .n { display: none; }
  .side .foot { margin: 0; flex-direction: row; flex-wrap: wrap; gap: 12px; }
  .top { padding: 12px 16px; position: static; }
  .month { margin-left: 0; }
  .proj { width: 100%; }
  .proj select { flex: 1; min-width: 0; }
  .content { padding: 18px 16px 50px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .cal { gap: 3px; }
  .day { min-height: 82px; padding: 4px; }
  .day label { grid-template-columns: 1fr; }
  .cal .dn { font-size: .6rem; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="k">Kit Escritoras</div><div class="s">Planner de tu novela</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <span class="save" id="saveState">Cargando…</span>
      <button class="linkbtn" id="btnBackup" type="button">Copia de seguridad</button>
      <button class="linkbtn" id="btnReset" type="button">Empezar en blanco</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="proj">
        <label for="projSel">Novela</label>
        <select id="projSel"></select>
        <button class="btn ghost sm" id="btnNewProj" type="button">+ Nueva</button>
      </div>
      <div class="month" id="monthNav">
        <button class="iconbtn" id="mPrev" type="button" aria-label="Mes anterior">‹</button>
        <span class="lbl" id="mLbl"></span>
        <button class="iconbtn" id="mNext" type="button" aria-label="Mes siguiente">›</button>
        <button class="btn ghost sm" id="mHoy" type="button">Hoy</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" type="button">Deshacer</button></div>

<script>
(function () {
"use strict";

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const eur = n => num(n).toLocaleString("es-ES", { style: "currency", currency: "EUR" });
const fmt = n => Math.round(num(n)).toLocaleString("es-ES");
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const TODAY = ymd(new Date());
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const monthOf = s => (s || "").slice(0, 7);
function addMonth(ym, k) { let [y, m] = ym.split("-").map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + "-" + pad(m); }
function monthDays(ym) { const [y, m] = ym.split("-").map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => ym + "-" + pad(i + 1)); }
const dow = s => (new Date(s + "T12:00:00").getDay() + 6) % 7;
const mesLabel = ym => { const [y, m] = ym.split("-").map(Number); return MESES[m - 1] + " " + y; };
const dayLabel = s => { if (!s) return "Sin fecha"; const d = new Date(s + "T12:00:00"); return d.getDate() + " " + MESES[d.getMonth()].slice(0, 3); };
const words = t => (String(t || "").trim().match(/\S+/g) || []).length;

/* ---------- Catálogos ---------- */
const FASES = ["Escritura", "Edición y diseño", "Publicación", "Preventa y promoción", "Prensa y colaboraciones", "Envíos"];
const BEATS = ["Planteamiento", "Detonante", "Primer cambio de rumbo", "Desarrollo", "Segundo cambio de rumbo", "Clímax", "Final"];
const TONES = {
  "Hecho": "ok", "Publicado": "ok", "Pagado": "ok", "Recibido": "ok", "Bueno": "ok", "Analizado": "ok", "Salió en prensa": "ok", "Ingreso": "ok",
  "En curso": "mid", "Programado": "mid", "Diseñado": "mid", "Copy listo": "mid", "Enviado": "mid", "Nota enviada": "mid", "Respondió": "mid", "Satisfactorio": "mid", "A cuenta": "mid",
  "Pendiente": "neu", "Idea": "neu", "Por contactar": "neu", "Regalo": "warm",
  "Incidencia": "bad", "Malo": "bad", "No repetir": "bad", "Sin respuesta": "bad", "Gasto": "bad",
  "Alta": "hi", "Media": "warm", "Baja": "neu"
};
const tone = v => "t-" + (TONES[v] || "neu");
const CONCEPTOS_VENTA = ["Digital", "Tapa blanda", "Tapa dura", "KENP (páginas leídas)", "Edición especial", "Preventa", "Venta directa", "Facebook Ads", "Amazon Ads", "Colaboraciones / sorteos", "Otro gasto"];

const LS_KEY = "kitEscritoras.v1";
let S = null;
let dbRef = null;
let saveTimer = null;
const view = { mes: monthOf(TODAY), route: "inicio", fase: "Todas", fTareas: "todas" };

function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function setSave(cls, txt) { const el = $("#saveState"); el.className = "save " + cls; el.textContent = txt; }

function save() {
  clearTimeout(saveTimer);
  setSave("", "Guardando…");
  saveTimer = setTimeout(async () => {
    const okLocal = saveLocal();
    if (dbRef) {
      try { await dbRef.set({ data: JSON.stringify(S), updated: new Date().toISOString() }); setSave("ok", "Guardado en tu cuenta"); }
      catch (e) { setSave("local", okLocal ? "Guardado solo en este navegador" : "No se ha podido guardar"); }
    } else {
      setSave("local", okLocal ? "Guardado en este navegador" : "No se ha podido guardar");
    }
  }, 600);
}

function normalize(st) {
  if (!st || !Array.isArray(st.proyectos) || !st.proyectos.length) return seed();
  ["posts", "ventas", "prensa", "colabs"].forEach(k => { if (!Array.isArray(st[k])) st[k] = []; });
  st.proyectos.forEach(p => {
    const base = newProject(p.titulo);
    Object.keys(base).forEach(k => { if (p[k] === undefined) p[k] = base[k]; });
  });
  if (!st.proyectos.some(p => p.id === st.activo)) st.activo = st.proyectos[0].id;
  return st;
}

async function connectDb() {
  let timer;
  const fallback = () => { if (!dbRef) setSave("local", "Guardado en este navegador"); };
  try {
    if (!window.claude || typeof window.claude.use !== "function") { fallback(); return; }
    timer = setTimeout(fallback, 10000);
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { clearTimeout(timer); fallback(); return; }
    const id = await user.id();
    if (!id) { clearTimeout(timer); fallback(); return; }
    const ref = db.collection("data/users/" + id).doc("kit");
    const snap = await ref.get();
    clearTimeout(timer);
    let data = null;
    if (snap) {
      const d = typeof snap.data === "function" ? snap.data() : snap;
      const exists = typeof snap.exists === "function" ? snap.exists() : (snap.exists !== undefined ? snap.exists : !!(d && d.data));
      if (exists && d && d.data) { try { data = JSON.parse(d.data); } catch (e) { data = null; } }
    }
    dbRef = ref;
    if (data) { S = normalize(data); saveLocal(); render(); setSave("ok", "Guardado en tu cuenta"); }
    else { save(); }
  } catch (e) {
    clearTimeout(timer);
    fallback();
  }
}

const P = () => S.proyectos.find(p => p.id === S.activo) || S.proyectos[0];

let undoFn = null, toastTimer = null;
function toast(msg, undo) {
  undoFn = undo || null;
  $("#toastMsg").textContent = msg;
  $("#toastUndo").style.display = undo ? "" : "none";
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 5000);
}
$("#toastUndo").addEventListener("click", () => { if (undoFn) { undoFn(); undoFn = null; save(); render(); } $("#toast").classList.remove("show"); });

function openModal(html, wire) {
  $("#modalBox").innerHTML = html;
  $("#modal").classList.add("open");
  const first = $("#modalBox input, #modalBox textarea, #modalBox button");
  if (first) first.focus();
  $$("[data-close]", $("#modalBox")).forEach(b => b.addEventListener("click", closeModal));
  if (wire) wire($("#modalBox"));
}
function closeModal() { $("#modal").classList.remove("open"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function bindAttrs(scope, list, id, k) { return `data-s="${scope}" data-l="${list}" data-id="${id}" data-k="${k}"`; }

function cellHTML(c, r, scope, list, p) {
  if (c.calc) {
    const v = c.calc(r, p);
    if (c.pillCalc) return `<td><span class="chip ${tone(v)}" data-calc="${c.k}">${esc(v)}</span></td>`;
    return `<td class="calc ${c.money && v < 0 ? "neg" : ""}" data-calc="${c.k}">${c.money ? eur(v) : esc(v)}</td>`;
  }
  const a = bindAttrs(scope, list, r.id, c.k);
  const v = r[c.k] == null ? "" : r[c.k];
  const st = c.w ? ` style="min-width:${c.w}px"` : "";
  const lab = ` aria-label="${esc(c.t)}"`;
  switch (c.type) {
    case "pill":
    case "select": {
      const opts = c.opts.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
      return `<td><select ${a}${lab} class="${c.type === "pill" ? "pill " + tone(v) : ""}">${!c.opts.includes(v) && v ? `<option selected>${esc(v)}</option>` : ""}${opts}</select></td>`;
    }
    case "date": return `<td${st}><input type="date" ${a}${lab} value="${esc(v)}"></td>`;
    case "money": return `<td${st}><input type="number" step="0.01" inputmode="decimal" ${a}${lab} value="${esc(v)}" placeholder="0,00"></td>`;
    case "number": return `<td${st}><input type="number" inputmode="numeric" ${a}${lab} value="${esc(v)}"></td>`;
    case "area": return `<td${st}><textarea rows="1" ${a}${lab}>${esc(v)}</textarea></td>`;
    default: return `<td${st}><input type="text" ${a}${lab} value="${esc(v)}"></td>`;
  }
}

function tableHTML(list, scope, rows, opts = {}) {
  const cols = COLS[opts.cols || list];
  const p = P();
  const head = cols.map(c => `<th>${esc(c.t)}</th>`).join("") + "<th></th>";
  const body = rows.length ? rows.map(r => `<tr data-row="${r.id}">${cols.map(c => cellHTML(c, r, scope, list, p)).join("")}<td><button class="del" type="button" title="Eliminar fila" aria-label="Eliminar fila" data-del="${r.id}" data-s="${scope}" data-l="${list}">×</button></td></tr>`).join("")
    : `<tr><td colspan="${cols.length + 1}" class="empty">${esc(opts.empty || "Todavía no hay nada aquí.")}</td></tr>`;
  const foot = opts.foot ? `<tfoot><tr>${opts.foot}</tr></tfoot>` : "";
  const add = opts.noAdd ? "" : `<div><button class="btn ghost sm" type="button" data-add="${list}" data-s="${scope}"${opts.preset ? ` data-preset='${esc(JSON.stringify(opts.preset))}'` : ""}>+ ${esc(opts.addLabel || "Añadir fila")}</button></div>`;
  return `<div class="tblwrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>${add}`;
}

function field(label, attrs, value, type = "text", extra = "") {
  if (type === "area") return `<label class="field"><span>${label}${extra}</span><textarea ${attrs}>${esc(value)}</textarea></label>`;
  return `<label class="field"><span>${label}${extra}</span><input type="${type}" ${attrs} value="${esc(value)}"></label>`;
}
const pf = k => `data-s="p" data-k="${k}"`;

function tile(t, v, d, cls = "") { return `<div class="tile ${cls}"><div class="t">${t}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`; }
function bar(pct, cls = "") { return `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`; }

/* ---------- Cálculos ---------- */
function escrituraStats(p, ym) {
  const days = monthDays(ym);
  let obj = 0, real = 0, diasObj = 0, diasOk = 0;
  days.forEach(d => { const e = p.escritura[d]; if (!e) return; obj += num(e.obj); real += num(e.real); if (num(e.obj) > 0) { diasObj++; if (num(e.real) >= num(e.obj)) diasOk++; } });
  let total = 0; Object.values(p.escritura).forEach(e => total += num(e.real));
  // racha: días seguidos con palabras hasta hoy (si hoy aún no hay, cuenta desde ayer)
  let racha = 0; const d = new Date(TODAY + "T12:00:00");
  if (!num((p.escritura[TODAY] || {}).real)) d.setDate(d.getDate() - 1);
  // los días de descanso (sin meta ni palabras) no rompen la racha
  for (let i = 0; i < 400; i++) {
    const e = p.escritura[ymd(d)] || {};
    if (num(e.real) > 0) racha++;
    else if (num(e.obj) > 0 || ymd(d) < "2000") break;
    else if (!Object.keys(p.escritura).some(k => k < ymd(d))) break;
    d.setDate(d.getDate() - 1);
  }
  return { obj, real, diasObj, diasOk, total, racha };
}
function dayState(e, d) {
  if (!e || (!num(e.obj) && !num(e.real))) return d < TODAY ? "" : "";
  if (num(e.obj) && num(e.real) >= num(e.obj)) return "done";
  if (num(e.real) > 0) return "part";
  if (num(e.obj) && d < TODAY) return "miss";
  return "";
}
function costesStats(p) {
  const total = p.costes.reduce((s, r) => s + num(r.importe), 0);
  const uds = num(p.unidades) || 0;
  const porLibro = uds ? total / uds : 0;
  const pvp = num(p.pvp);
  return { total, porLibro, margen: pvp - porLibro, equilibrio: pvp > 0 ? Math.ceil(total / pvp) : 0 };
}
function ventasMes(ym) {
  let ing = 0, gas = 0, uds = 0, kenp = 0;
  S.ventas.filter(v => v.mes === ym).forEach(v => {
    if (GASTOS.includes(v.concepto)) gas += num(v.importe);
    else { ing += num(v.importe); if (v.concepto.startsWith("KENP")) kenp += num(v.uds); else uds += num(v.uds); }
  });
  return { ing, gas, neto: ing - gas, uds, kenp };
}
function pedidosStats(p) {
  const r = { n: p.pedidos.length, cobrado: 0, porCobrar: 0, porEnviar: 0, benef: 0 };
  p.pedidos.forEach(o => {
    if (o.pago === "Pagado" || o.pago === "A cuenta") r.cobrado += num(o.importe);
    if (o.pago === "Pendiente") r.porCobrar += num(o.importe) || num(p.pvp);
    if (o.estado === "Pendiente") r.porEnviar++;
    r.benef += num(o.importe) - num(p.costeEjemplar) - num(o.costeEnvio);
  });
  return r;
}

/* 3. Escritura */
function vEscritura() {
  const p = P(), ym = view.mes;
  const es = escrituraStats(p, ym);
  const pct = es.obj ? Math.round(es.real / es.obj * 100) : 0;
  const days = monthDays(ym);
  const lead = dow(days[0]);
  let cells = DIAS.map(d => `<div class="dn">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="day blank" aria-hidden="true"></div>`;
  days.forEach(d => {
    const e = p.escritura[d] || {};
    const st = dayState(e, d);
    const rest = !num(e.obj) && !num(e.real) ? " rest" : "";
    cells += `<div class="day ${st}${rest}${d === TODAY ? " today" : ""}" data-daycell="${d}">
      <div class="num">${Number(d.slice(8))}</div>
      <label>Meta<input type="number" inputmode="numeric" data-day="${d}" data-k="obj" value="${esc(e.obj || "")}" aria-label="Meta del ${dayLabel(d)}"></label>
      <label>Hecho<input type="number" inputmode="numeric" data-day="${d}" data-k="real" value="${esc(e.real || "")}" aria-label="Palabras escritas el ${dayLabel(d)}"></label>
      <input class="caps" type="text" data-day="${d}" data-k="caps" value="${esc(e.caps || "")}" placeholder="Capítulos" aria-label="Capítulos del ${dayLabel(d)}">
    </div>`;
  });
  const media = es.diasObj ? Math.round(es.real / Math.max(1, days.filter(d => d <= TODAY && p.escritura[d] && num(p.escritura[d].obj)).length)) : 0;
  return `
  <div class="head"><div><div class="eyebrow">Calendario de escritura</div><h1 style="text-transform:capitalize">${mesLabel(ym)}</h1>
    <p>Apunta cada día tu meta y las palabras que escribes. Verde: meta cumplida. Ámbar: a medias. Rosa: día con meta sin escribir.</p></div>
    <button class="btn" type="button" id="btnPlan">Crear plan de escritura</button></div>
  <div class="tiles" id="escTiles">${escTiles(es, pct, media, p)}</div>
  <div class="cal">${cells}</div>`;
}
function escTiles(es, pct, media, p) {
  const totalPct = p.objetivoPalabras ? Math.round(es.total / num(p.objetivoPalabras) * 100) : 0;
  return tile("Escritas este mes", fmt(es.real), `${pct}% de ${fmt(es.obj)}`, pct >= 100 ? "ok" : "") +
    tile("Días con meta cumplida", `${es.diasOk} / ${es.diasObj}`, "en este mes", "lav") +
    tile("Racha actual", es.racha + (es.racha === 1 ? " día" : " días"), "seguidos con palabras", es.racha >= 3 ? "ok" : "") +
    tile("Manuscrito", totalPct + "%", `${fmt(es.total)} de ${fmt(p.objetivoPalabras)} palabras`, "");
}
function refreshEscritura() {
  const p = P(), ym = view.mes;
  const es = escrituraStats(p, ym);
  const pct = es.obj ? Math.round(es.real / es.obj * 100) : 0;
  const t = $("#escTiles"); if (t) t.innerHTML = escTiles(es, pct, 0, p);
  $$("[data-daycell]").forEach(c => {
    const d = c.dataset.daycell, e = p.escritura[d] || {};
    c.classList.remove("done", "part", "miss", "rest");
    const st = dayState(e, d); if (st) c.classList.add(st);
    if (!num(e.obj) && !num(e.real)) c.classList.add("rest");
  });
}
function openPlan() {
  const p = P();
  const ini = view.mes === monthOf(TODAY) ? TODAY : view.mes + "-01";
  openModal(`<h2>Crear plan de escritura</h2>
    <p class="hint" style="margin:0">Reparte las palabras que te quedan entre los días que vas a escribir. Solo cambia la meta de esos días; lo que ya has escrito no se toca.</p>
    <div class="fgrid">
      <label class="field"><span>Desde</span><input type="date" id="plIni" value="${ini}"></label>
      <label class="field"><span>Hasta</span><input type="date" id="plFin" value="${monthDays(view.mes).slice(-1)[0]}"></label>
      <label class="field"><span>Palabras a escribir</span><input type="number" id="plPal" value="${Math.max(0, num(p.objetivoPalabras) - escrituraStats(p, view.mes).total)}"></label>
    </div>
    <div class="field"><span>Días que escribes</span><div class="days7">${DIAS.map((d, i) => `<label><input type="checkbox" value="${i}" ${i < 5 ? "checked" : ""}> ${d}</label>`).join("")}</div></div>
    <p class="hint" id="plRes" style="margin:0"></p>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn" type="button" id="plOk">Aplicar plan</button></div>`, box => {
    const calc = () => {
      const a = $("#plIni", box).value, b = $("#plFin", box).value;
      const dias = $$(".days7 input:checked", box).map(x => +x.value);
      const list = [];
      if (a && b && a <= b) { const d = new Date(a + "T12:00:00"); while (ymd(d) <= b && list.length < 800) { if (dias.includes((d.getDay() + 6) % 7)) list.push(ymd(d)); d.setDate(d.getDate() + 1); } }
      const per = list.length ? Math.ceil(num($("#plPal", box).value) / list.length) : 0;
      $("#plRes", box).textContent = list.length ? `${list.length} días de escritura · ${fmt(per)} palabras al día` : "Elige un rango de fechas y al menos un día.";
      return { list, per };
    };
    box.addEventListener("input", calc); calc();
    $("#plOk", box).addEventListener("click", () => {
      const { list, per } = calc(); if (!list.length) return;
      list.forEach(d => { p.escritura[d] = Object.assign({ real: "", caps: "" }, p.escritura[d] || {}, { obj: per }); });
      closeModal(); save(); render(); toast(`Plan aplicado: ${fmt(per)} palabras en ${list.length} días`);
    });
  });
}

/* 4. Lanzamiento */
function vLanzamiento() {

  const hechas = p.tareas.filter(t => t.estado === "Hecho").length;
  const coste = p.tareas.reduce((s, t) => s + num(t.coste), 0);
  const fases = FASES.concat([...new Set(p.tareas.map(t => t.fase))].filter(x => !FASES.includes(x)));
  const blocks = fases.map(fa => {
    const all = p.tareas.filter(t => t.fase === fa);
    const rows = all.filter(filt);
    if (!all.length && f !== "todas") return "";
    const h = all.filter(t => t.estado === "Hecho").length;
    const pc = all.length ? Math.round(h / all.length * 100) : 0;
    return `<div class="card phase"><div class="ph"><h3>${esc(fa)}</h3>${bar(pc, pc === 100 ? "ok" : "")}<span class="pct">${h}/${all.length}</span></div>
      ${tableHTML("tareas", "p", rows, { preset: { fase: fa }, addLabel: "Añadir tarea", empty: f === "todas" ? "Sin tareas en esta fase." : "Nada con este filtro." })}</div>`;
  }).join("");
  const fb = (k, t) => `<button type="button" data-ftareas="${k}" aria-pressed="${f === k}">${t}</button>`;
  return `
  <div class="head"><div><div class="eyebrow">Checklist de lanzamiento</div><h1>Del manuscrito a la librería</h1>
    <p>Todo lo que hay que hacer para publicar, agrupado por fases. Ponle fecha a una tarea y te aparecerá en «Mi mes».</p></div></div>
  <div class="tiles">${tile("Hechas", `${hechas} / ${p.tareas.length}`, Math.round(hechas / Math.max(1, p.tareas.length) * 100) + "% del lanzamiento", "ok")}
    ${tile("En curso", p.tareas.filter(t => t.estado === "En curso").length, "tareas abiertas", "lav")}
    ${tile("Con fecha este mes", p.tareas.filter(t => monthOf(t.fecha) === view.mes).length, mesLabel(view.mes), "")}
    ${tile("Coste apuntado", eur(coste), "suma de la columna Coste", "")}</div>
  <div class="filters">${fb("todas", "Todas")}${fb("pendientes", "Solo pendientes")}${fb("mes", "Con fecha este mes")}</div>
  ${blocks}`;
}

/* 5. Redes */
function vRedes() {
  const ym = view.mes;
  const mes = S.posts.filter(x => monthOf(x.fecha) === ym).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const sinFecha = S.posts.filter(x => !x.fecha);
  const days = monthDays(ym);
  let cells = DIAS.map(d => `<div class="dn">${d}</div>`).join("");
  for (let i = 0; i < dow(days[0]); i++) cells += `<div class="day blank" aria-hidden="true"></div>`;
  days.forEach(d => {
    const list = mes.filter(x => x.fecha === d);
    cells += `<div class="day post-day${d === TODAY ? " today" : ""}"><div class="num">${Number(d.slice(8))}<button class="linkbtn" type="button" data-addpost="${d}" aria-label="Añadir publicación el ${dayLabel(d)}" title="Añadir publicación">+</button></div>
      <div class="chips">${list.map(x => `<span class="chip ${tone(x.estado)}" title="${esc(x.red + " · " + x.tipo + " · " + x.contenido)}">${esc(x.tipo)}: ${esc(x.contenido || "sin título")}</span>`).join("")}</div></div>`;
  });
  const est = ["Idea", "Diseñado", "Copy listo", "Programado", "Publicado", "Analizado"];
  const counts = est.map(e => `<span class="chip ${tone(e)}">${e}: ${mes.filter(x => x.estado === e).length}</span>`).join(" ");
  return `
  <div class="head"><div><div class="eyebrow">Calendario de contenidos</div><h1 style="text-transform:capitalize">${mesLabel(ym)}</h1>
    <p>Planifica posts, reels, stories y newsletters. Pulsa + en un día para añadir una publicación.</p></div></div>
  <div class="filters">${counts}</div>
  <div class="cal">${cells}</div>
  <div class="card"><div class="ch"><h3>Publicaciones de ${MESES[+ym.slice(5) - 1]}</h3><span class="hint">${mes.length} publicaciones</span></div>
    ${tableHTML("posts", "g", mes, { preset: { fecha: ym === monthOf(TODAY) ? TODAY : ym + "-01" }, addLabel: "Añadir publicación", empty: "Aún no hay publicaciones este mes." })}</div>
  ${sinFecha.length ? `<div class="card"><h3>Ideas sin fecha</h3>${tableHTML("posts", "g", sinFecha, { noAdd: true })}</div>` : ""}`;
}

/* 6. Pedidos */

  <div class="head"><div><div class="eyebrow">Preventa y pedidos</div><h1>Pedidos en papel</h1>

  <div class="tiles">${tile("Pedidos", ps.n, "", "")}${tile("Cobrado", eur(ps.cobrado), "pagados y a cuenta", "ok")}
    ${tile("Por cobrar", eur(ps.porCobrar), "pagos pendientes", ps.porCobrar ? "warn" : "")}${tile("Por enviar", ps.porEnviar, "pedidos pendientes", ps.porEnviar ? "warn" : "")}

    ${tableHTML("pedidos", "p", p.pedidos, { addLabel: "Añadir pedido", empty: "Cuando abras la preventa, apunta aquí cada pedido.", preset: { envio: "Ordinario", pago: "Pendiente", estado: "Pendiente", importe: p.pvp } })}</div>`;
}

/* 7. Cuentas */
function vCuentas() {
  const p = P(), cs = costesStats(p), ym = view.mes, vm = ventasMes(ym);
  const rows = S.ventas.filter(v => v.mes === ym);
  return `
  <div class="head"><div><div class="eyebrow">Cuentas</div><h1>Lo que cuesta y lo que deja</h1>
    <p>Arriba, cuánto has invertido en este libro y cuántos ejemplares necesitas vender para recuperarlo. Abajo, tus regalías de cada mes.</p></div></div>
  <div class="card"><div class="ch"><h3>Contabilidad del libro: ${esc(p.titulo)}</h3></div>
    <div class="tiles" id="costTiles">${costTiles(cs)}</div>
    <div class="fgrid">${field("Ejemplares impresos", pf("unidades"), p.unidades, "number")}${field("Precio de venta (PVP)", pf("pvp"), p.pvp, "number")}</div>
    ${tableHTML("costes", "p", p.costes, { addLabel: "Añadir gasto" })}</div>
  <div class="card"><div class="ch"><h3 style="text-transform:capitalize">Ventas de ${mesLabel(ym)}</h3><span class="hint">Copia las cifras del informe de regalías de KDP</span></div>
    <div class="tiles" id="ventTiles">${ventTiles(vm)}</div>
    ${tableHTML("ventas", "g", rows, { preset: { mes: ym, libro: p.titulo, concepto: "Digital" }, addLabel: "Añadir línea", empty: "Sin ventas apuntadas este mes." })}</div>
  <div class="card chart"><div class="ch"><h3>Resultado neto de ${ym.slice(0, 4)}</h3><span class="hint" id="anualTot"></span></div><div id="chart"></div></div>`;
}
function costTiles(cs) {
  return tile("Inversión total", eur(cs.total), "", "") + tile("Coste por ejemplar", eur(cs.porLibro), "inversión ÷ ejemplares", "lav") +
    tile("Margen por ejemplar", eur(cs.margen), "PVP − coste por ejemplar", cs.margen < 0 ? "bad" : "ok") +
    tile("Para recuperar la inversión", fmt(cs.equilibrio) + " libros", "vendidos a PVP", "warn");
}
function ventTiles(vm) {
  return tile("Regalías", eur(vm.ing), "", "ok") + tile("Gastos en anuncios", eur(vm.gas), "", vm.gas ? "warn" : "") +
    tile("Neto del mes", eur(vm.neto), "", vm.neto < 0 ? "bad" : "ok") + tile("Libros vendidos", fmt(vm.uds), fmt(vm.kenp) + " páginas KENP", "lav");
}
function drawChart() {
  const el = $("#chart"); if (!el) return;
  const y = view.mes.slice(0, 4);
  const vals = Array.from({ length: 12 }, (_, i) => ventasMes(y + "-" + pad(i + 1)).neto);
  const W = 640, H = 220, L = 52, R = 10, T = 16, B = 28;
  const mx = Math.max(10, ...vals), mn = Math.min(0, ...vals);
  const step = Math.pow(10, Math.floor(Math.log10(mx - mn || 1)));
  const top = Math.ceil(mx / step) * step, bot = Math.floor(mn / step) * step || 0;
  const yS = v => T + (top - v) / (top - bot) * (H - T - B);
  const bw = (W - L - R) / 12;
  const sel = +view.mes.slice(5) - 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultado neto por mes en ${y}">`;
  const ticks = []; for (let v = bot; v <= top + 1e-9; v += (top - bot) / 4) ticks.push(v);
  ticks.forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${yS(v)}" y2="${yS(v)}" stroke="#eadcd8" stroke-width="1"/><text x="${L - 6}" y="${yS(v) + 4}" text-anchor="end">${Math.round(v)} €</text>`; });
  vals.forEach((v, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    const y0 = yS(0), y1 = yS(v);
    const col = v < 0 ? "#a83e3e" : i === sel ? "#a5595d" : "#dfadad";
    if (v !== 0) s += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="4" fill="${col}"><title>${MESES[i]}: ${eur(v)}</title></rect>`;
    s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" style="${i === sel ? "font-weight:700;fill:#3a2a2c" : ""}">${MESES[i].slice(0, 3)}</text>`;
    if (i === sel && v !== 0) s += `<text x="${x + w / 2}" y="${(v < 0 ? Math.max(y0, y1) + 13 : Math.min(y0, y1) - 5)}" text-anchor="middle" style="font-weight:700;fill:#3a2a2c">${Math.round(v)} €</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${yS(0)}" y2="${yS(0)}" stroke="#7a6668" stroke-width="1"/></svg>`;
  el.innerHTML = s;
  const tot = vals.reduce((a, b) => a + b, 0);
  const at = $("#anualTot"); if (at) at.textContent = "Total del año: " + eur(tot);
}

/* 8. Prensa y colaboraciones */
function vPrensa() {
  const colabCost = S.colabs.reduce((s, c) => s + num(c.coste), 0);
  return `
  <div class="head"><div><div class="eyebrow">Difusión</div><h1>Prensa y colaboraciones</h1>
    <p>Los medios a los que mandas tu nota de prensa y las cuentas lectoras con las que colaboras.</p></div></div>
  <div class="tiles">${tile("Medios", S.prensa.length, S.prensa.filter(x => x.estado === "Salió en prensa").length + " han publicado", "")}
    ${tile("Por contactar", S.prensa.filter(x => x.estado === "Por contactar").length, "medios", "warn")}
    ${tile("Colaboraciones", S.colabs.length, S.colabs.filter(c => c.resultado === "Bueno").length + " con buen resultado", "lav")}
    ${tile("Coste en colaboraciones", eur(colabCost), "libros + envíos", "")}</div>
  <div class="card"><h3>Medios de prensa</h3>${tableHTML("prensa", "g", S.prensa, { addLabel: "Añadir medio", preset: { estado: "Por contactar", tipo: "Periódico" } })}</div>
  <div class="card"><h3>Colaboraciones</h3>${tableHTML("colabs", "g", S.colabs, { addLabel: "Añadir colaboración", preset: { resultado: "Pendiente", red: "Instagram", motivo: "Lanzamiento" } })}</div>`;
}

/* ---------- Edición ---------- */
function readVal(el) {
  if (el.type === "checkbox") return el.checked;
  if (el.type === "number") return el.value === "" ? "" : num(el.value);
  return el.value;
}
function applyEdit(el) {
  const d = el.dataset;
  if (d.day) {
    const p = P();
    const e = p.escritura[d.day] || (p.escritura[d.day] = { obj: "", real: "", caps: "" });
    e[d.k] = readVal(el);
    return true;
  }
  if (!d.s) return false;
  const base = d.s === "g" ? S : P();
  if (d.arr) { base[d.arr][+d.i] = el.value; return true; }
  if (d.l) { const it = base[d.l].find(x => x.id === d.id); if (!it) return false; it[d.k] = readVal(el); return true; }
  if (d.k) { base[d.k] = readVal(el); return true; }
  return false;
}

document.addEventListener("input", e => {
  const el = e.target;
  if (!el.closest("#view") || !applyEdit(el)) return;
  save();
  const d = el.dataset;
  if (el.tagName === "TEXTAREA") autosize(el);
  if (d.day) { refreshEscritura(); return; }
  if (d.arr === "kdp") { const c = $(`[data-count="kdp${d.i}"]`); if (c) { c.textContent = el.value.length + "/50"; c.classList.toggle("over", el.value.length > 50); } return; }
  if (d.k === "sinopsis") { const c = $('[data-count="sinopsis"]'); if (c) c.textContent = words(el.value) + " palabras"; }
  if (d.k === "titulo" && !d.l) { renderNav(); return; }
  // celdas calculadas de la fila
  const tr = el.closest("[data-row]");
  if (tr && d.l && COLS[d.l]) {
    const it = (d.s === "g" ? S : P())[d.l].find(x => x.id === d.id);
    $$("[data-calc]", tr).forEach(c => {
      const col = COLS[d.l].find(x => x.k === c.dataset.calc);
      const v = col.calc(it, P());
      if (col.pillCalc) { c.textContent = v; c.className = "chip " + tone(v); }
      else { c.textContent = col.money ? eur(v) : v; c.classList.toggle("neg", col.money && v < 0); }
    });
  }
  if (view.route === "cuentas") {
    const ct = $("#costTiles"); if (ct) ct.innerHTML = costTiles(costesStats(P()));
    const vt = $("#ventTiles"); if (vt) vt.innerHTML = ventTiles(ventasMes(view.mes));
    drawChart();
  }
  if (view.route === "pedidos" && d.k === "costeEjemplar") $$("[data-row]").forEach(tr2 => {
    const it = P().pedidos.find(x => x.id === tr2.dataset.row); const c = $('[data-calc="_benef"]', tr2);
    if (it && c) { const v = COLS.pedidos[8].calc(it, P()); c.textContent = eur(v); c.classList.toggle("neg", v < 0); }
  });
});
document.addEventListener("change", e => {
  const el = e.target;
  if (!el.closest("#view")) return;
  if (el.matches("select, input[type=date]")) { applyEdit(el); save(); render(); return; }
  if (el.dataset.k === "objetivoPalabras" || el.closest(".tiles") === null && ["pvp", "unidades", "costeEjemplar"].includes(el.dataset.k)) { render(); }
});

document.addEventListener("click", e => {
  const t = e.target.closest("button, input[type=checkbox]");
  if (!t) return;
  const d = t.dataset;
  if (d.add) {
    const base = d.s === "g" ? S : P();
    const preset = d.preset ? JSON.parse(d.preset) : {};
    const item = { id: uid() };
    if (COLS[d.add]) COLS[d.add].forEach(c => { if (!c.calc) item[c.k] = c.opts ? c.opts[0] : ""; });
    if (d.add === "personajes") Object.assign(item, { nombre: "", rol: "Secundario", edad: "", trabajo: "", musa: "", conflicto: "", aesthetic: "", notas: "" });
    Object.assign(item, preset);
    base[d.add].push(item);
    save(); render();
    const first = $(`[data-row="${item.id}"] input, [data-row="${item.id}"] textarea`); if (first) first.focus();
    return;
  }
  if (d.del) {
    const base = d.s === "g" ? S : P();
    const arr = base[d.l]; const i = arr.findIndex(x => x.id === d.del); if (i < 0) return;
    const [removed] = arr.splice(i, 1);
    save(); render();
    toast("Fila eliminada", () => arr.splice(i, 0, removed));
    return;
  }
  if (d.done) {
    const tk = P().tareas.find(x => x.id === d.done); if (!tk) return;
    const prev = tk.estado; tk.estado = "Hecho"; save();
    setTimeout(render, 250);
    toast("Tarea hecha: " + tk.tarea, () => { tk.estado = prev; });
    return;
  }
  if (d.ftareas) { view.fTareas = d.ftareas; render(); return; }
  if (d.addpost) {
    S.posts.push({ id: uid(), fecha: d.addpost, red: "Instagram", tipo: "Post", contenido: "", copy: "", hashtags: "", cta: "", estado: "Idea" });
    save(); render();
    const rows = $$("#view .tbl [data-row]"); const last = S.posts[S.posts.length - 1];
    const inp = $(`[data-row="${last.id}"] [data-k="contenido"]`); if (inp) inp.focus();
    return;
  }
  if (t.id === "btnPlan") { openPlan(); return; }
  if (t.id === "btnDelProj") { confirmDelProj(); return; }
});

/* ---------- Novelas, copia y reinicio ---------- */
$("#projSel").addEventListener("change", e => { S.activo = e.target.value; save(); render(); });
$("#btnNewProj").addEventListener("click", () => {
  openModal(`<h2>Nueva novela</h2><label class="field"><span>Título</span><input type="text" id="npT" placeholder="Título provisional"></label>
    <p class="hint" style="margin:0">Empieza con la checklist completa de lanzamiento. Las redes, ventas y prensa son comunes a todas tus novelas.</p>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn" type="button" id="npOk">Crear</button></div>`, box => {
    const go = () => { const p = newProject($("#npT", box).value.trim() || "Nueva novela"); S.proyectos.push(p); S.activo = p.id; closeModal(); save(); location.hash = "novela"; render(); };
    $("#npOk", box).addEventListener("click", go);
    $("#npT", box).addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
});
function confirmDelProj() {
  const p = P();
  if (S.proyectos.length < 2) { toast("Es tu única novela: crea otra antes de eliminar esta."); return; }
  openModal(`<h2>¿Eliminar «${esc(p.titulo)}»?</h2><p style="margin:0">Se borran su ficha, escritura, checklist, pedidos y costes. Las redes, ventas y prensa se quedan.</p>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn danger" type="button" id="dpOk">Eliminar novela</button></div>`, box => {
    $("#dpOk", box).addEventListener("click", () => { S.proyectos = S.proyectos.filter(x => x.id !== p.id); S.activo = S.proyectos[0].id; closeModal(); save(); render(); });
  });
}
$("#btnBackup").addEventListener("click", () => {
  openModal(`<h2>Copia de seguridad</h2>
    <p class="hint" style="margin:0">Copia este texto y guárdalo en un documento. Para recuperar tus datos, pégalo aquí y pulsa «Restaurar».</p>
    <label class="field"><span>Tus datos</span><textarea id="bkT" style="min-height:180px;font-family:monospace;font-size:.75rem">${esc(JSON.stringify(S))}</textarea></label>
    <p class="hint" id="bkMsg" style="margin:0"></p>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cerrar</button><button class="btn ghost" type="button" id="bkRes">Restaurar</button><button class="btn" type="button" id="bkCopy">Copiar</button></div>`, box => {
    $("#bkCopy", box).addEventListener("click", async () => {
      try { await navigator.clipboard.writeText($("#bkT", box).value); $("#bkMsg", box).textContent = "Copiado. Pégalo en un documento para guardarlo."; }
      catch (e) { $("#bkT", box).select(); $("#bkMsg", box).textContent = "Tu navegador no deja copiar automáticamente: el texto ya está seleccionado, usa Ctrl+C."; }
    });
    $("#bkRes", box).addEventListener("click", () => {
      try { const d = JSON.parse($("#bkT", box).value); if (!d.proyectos) throw 0; S = normalize(d); closeModal(); save(); render(); toast("Datos restaurados"); }
      catch (e) { $("#bkMsg", box).textContent = "Ese texto no es una copia válida del Kit Escritoras."; }
    });
  });
});
$("#btnReset").addEventListener("click", () => {
  openModal(`<h2>Empezar en blanco</h2><p style="margin:0">Se borran los datos de ejemplo y todo lo que hayas escrito. Te quedará una novela vacía con la checklist de lanzamiento. Si quieres conservar algo, haz antes una copia de seguridad.</p>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn danger" type="button" id="rsOk">Borrar todo y empezar</button></div>`, box => {
    $("#rsOk", box).addEventListener("click", () => {
      const p = newProject("Mi novela");
      S = { v: 1, activo: p.id, proyectos: [p], posts: [], ventas: [], prensa: [], colabs: [] };
      closeModal(); save(); location.hash = "novela"; render();
    });
  });
});

/* ---------- Navegación ---------- */
$("#mPrev").addEventListener("click", () => { view.mes = addMonth(view.mes, -1); render(); });
$("#mNext").addEventListener("click", () => { view.mes = addMonth(view.mes, 1); render(); });
$("#mHoy").addEventListener("click", () => { view.mes = monthOf(TODAY); render(); });
function route() {
  const h = (location.hash || "").replace("#", "");
  view.route = ROUTES.some(r => r[0] === h) ? h : "inicio";
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Arranque ---------- */
S = normalize(loadLocal() || seed());
route();
setSave("", "Conectando…");
connectDb();
// Instalable y sin conexión cuando se abre desde GitHub Pages (https)
if ("serviceWorker" in navigator && location.protocol === "https:" && !location.hostname.endsWith("claude.ai") && !location.hostname.endsWith("claudeusercontent.com")) {
  navigator.serviceWorker.register("sw.js").then(reg => { reg.update().catch(() => {}); }).catch(() => {});
}
window.addEventListener("pagehide", saveLocal);
})();
</script>
