<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit Escritoras</title>
<meta name="theme-color" content="#a5595d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Escritoras">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="32.png">
<link rel="apple-touch-icon" href="180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" title="Kit Escritoras · planner de tu novela"><div class="logo">K</div></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="foot">
      <button class="railbtn" id="btnBackup" type="button" title="Descargar una copia de seguridad"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Copia</button>
      <span class="save" id="saveState">Cargando…</span>
      <button class="linkbtn" id="btnReset" type="button">Empezar en blanco</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="proj">
        <label for="projSel">Novela</label>
        <select id="projSel"></select>
        <button class="btn ghost sm" id="btnNewProj" type="button">+ Nueva</button>
      </div>
      <div class="month" id="monthNav">
        <button class="iconbtn" id="mPrev" type="button" aria-label="Mes anterior">‹</button>
        <span class="lbl" id="mLbl"></span>
        <button class="iconbtn" id="mNext" type="button" aria-label="Mes siguiente">›</button>
        <button class="btn ghost sm" id="mHoy" type="button">Hoy</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" type="button">Deshacer</button></div>

<script src="app.js"></script>
<script src="version.js" data-ancla="#ajCopia" data-prefijo="ks-"></script>
<script src="apps.js" data-app="kit" data-ancla="#ajCopia"></script>
</body>
</html>
